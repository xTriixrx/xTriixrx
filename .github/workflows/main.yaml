name: Profile Stats & Chess.com

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/main.yaml
      - .github/scripts/**
  schedule:
    - cron: '45 23 * * 0' # Execute cron every Sunday at 11:45PM
  workflow_dispatch:

jobs:
  stats-assets:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout current repository to Master branch
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Select featured repositories
        id: featured
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/select-featured-repositories.sh
      - name: Prepare generated asset directory
        run: bash .github/scripts/prepare-profile-assets.sh
      - name: Generate featured repository card 1
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.repo_1 }}&theme=tokyonight&hide_border=true
          path: profile/featured-repo-1.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate featured repository card 2
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.repo_2 }}&theme=tokyonight&hide_border=true
          path: profile/featured-repo-2.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate featured repository card 3
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.repo_3 }}&theme=tokyonight&hide_border=true
          path: profile/featured-repo-3.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate featured repository card 4
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.repo_4 }}&theme=tokyonight&hide_border=true
          path: profile/featured-repo-4.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate featured repository card 5
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.repo_5 }}&theme=tokyonight&hide_border=true
          path: profile/featured-repo-5.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate featured repository card 6
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ steps.featured.outputs.repo_6 }}&theme=tokyonight&hide_border=true
          path: profile/featured-repo-6.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate active languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&layout=compact&langs_count=10
          path: profile/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Update featured repository links
        env:
          REPO_1_URL: ${{ steps.featured.outputs.url_1 }}
          REPO_2_URL: ${{ steps.featured.outputs.url_2 }}
          REPO_3_URL: ${{ steps.featured.outputs.url_3 }}
          REPO_4_URL: ${{ steps.featured.outputs.url_4 }}
          REPO_5_URL: ${{ steps.featured.outputs.url_5 }}
          REPO_6_URL: ${{ steps.featured.outputs.url_6 }}
        run: bash .github/scripts/update-featured-repository-links.sh
      - name: Commit and push generated stats assets
        uses: devops-infra/action-commit-push@v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: Automated Profile Stats Update
  trophies:
    needs: stats-assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout current repository to Master branch
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Checkout GitHub trophy generator
        uses: actions/checkout@v7
        with:
          repository: lucthienphong1120/github-trophies
          ref: 8ed4ccda2839a520a250184eba4bf67c7626cb87
          path: .trophy-generator
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Apply GitHub API compatibility fixes
        run: bash .github/scripts/patch-trophy-generator.sh
      - name: Generate filtered GitHub trophy SVG locally
        env:
          GITHUB_TOKEN: ${{ secrets.TROPHY_TOKEN }}
        run: bash .github/scripts/generate-trophies.sh
      - name: Commit and Push new GitHub Trophy SVG to the repository
        uses: devops-infra/action-commit-push@v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: Automated GitHub Trophy Update
  chess:
    needs: trophies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository to Master branch
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Update readme with your chess stats and games
        uses: Balastrong/chess-stats-action@main
        with:
          CHESS_USERNAME: xTriixrx
