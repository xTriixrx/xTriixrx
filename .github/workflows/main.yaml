name: Profile Stats & Chess.com

on:
  schedule:
    - cron: '45 23 * * 0' # Execute cron every Sunday at 11:45PM
  workflow_dispatch:

jobs:
  remove-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository to Master branch
        uses: actions/checkout@v7
      - name: Remove old language-graph.png file
        run: |
          if [ -f "language-graph.png" ]; then
            echo "Removing old Languages Chart"
            rm language-graph.png
          fi
      - name: Commit and Push Removed Language Image to the repository
        uses: devops-infra/action-commit-push@v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: Automated Language Chart Removal
      - name: Wait 5 seconds for remote to update
        run: sleep 5
  build-image:
    needs: remove-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository to Master branch
        uses: actions/checkout@v7
        with:
          ref: master
      - run: git pull
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies and build outputs to improve workflow execution time.
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-js-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: |
          npm install
          npx playwright install
      - name: Generate LANGUAGE Image file
        run: node index.js
      - name: Commit and Push new LANGUAGE Image to the repository
        uses: devops-infra/action-commit-push@v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: Automated Language Chart Update
  trophies:
    needs: build-image
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout current repository to Master branch
        uses: actions/checkout@v7
        with:
          ref: master
      - run: git pull
      - name: Checkout GitHub trophy generator
        uses: actions/checkout@v7
        with:
          repository: lucthienphong1120/github-trophies
          ref: 8ed4ccda2839a520a250184eba4bf67c7626cb87
          path: .trophy-generator
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Apply GitHub API compatibility fixes
        run: |
          sed -i \
            's/repositories(first: 100, ownerAffiliations:/repositories(first: 100, privacy: PUBLIC, ownerAffiliations:/' \
            .trophy-generator/src/github_api_client.ts
          sed -i \
            's/userRepository.repositories.nodes.reduce(/userRepository.repositories.nodes.filter((node) => node != null).reduce(/' \
            .trophy-generator/src/user_info.ts
          sed -i \
            's/userRepository.repositories.nodes.forEach(/userRepository.repositories.nodes.filter((node) => node != null).forEach(/' \
            .trophy-generator/src/user_info.ts
          grep --quiet 'repositories(first: 100, privacy: PUBLIC,' \
            .trophy-generator/src/github_api_client.ts
          test "$(grep --count 'filter((node) => node != null)' \
            .trophy-generator/src/user_info.ts)" -eq 2
      - name: Generate filtered GitHub trophy SVG locally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '/.trophy-generator/' >> .git/info/exclude
          deno run --allow-net --allow-read --allow-env \
            .trophy-generator/debug.ts &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f github-trophies.svg.tmp
          }
          trap cleanup EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              'http://127.0.0.1:8080/?username=xTriixrx&theme=tokyonight&column=2&no-bg=true&no-frame=true&rank=SECRET,SSS,SS,S,AAA,AA,A,B' \
              --output github-trophies.svg.tmp; then
              break
            fi
            sleep 1
          done

          test -s github-trophies.svg.tmp
          grep --quiet '<svg' github-trophies.svg.tmp
          mv github-trophies.svg.tmp github-trophies.svg
      - name: Commit and Push new GitHub Trophy SVG to the repository
        uses: devops-infra/action-commit-push@v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: Automated GitHub Trophy Update
  chess:
    needs: trophies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository to Master branch
        uses: actions/checkout@v7
        with:
          ref: master
      - run: git pull
      - name: Update readme with your chess stats and games
        uses: Balastrong/chess-stats-action@main
        with:
          CHESS_USERNAME: xTriixrx
